<!doctype html><html><head><meta charset="utf-8"><title>Copy image</title>
<style>body{font-family:sans-serif;background:#111;color:#eee;margin:20px}button{font-size:28px;padding:20px 40px}img{max-height:70vh;display:block;margin-top:16px}</style></head>
<body><button id="b">COPY IMAGE</button><span id="s"></span><img id="i">
<script>
const q=new URLSearchParams(location.search); const src=q.get('img'); document.getElementById('i').src=src;
document.getElementById('b').onclick=async()=>{try{const r=await fetch(src);const b=await r.blob();
const png=b.type==='image/png'?b:await new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);c.toBlob(res,'image/png')};im.src=URL.createObjectURL(b)});
await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);document.getElementById('s').textContent=' copied '+png.size;}catch(e){document.getElementById('s').textContent=' ERR '+e}};
</script></body></html>
