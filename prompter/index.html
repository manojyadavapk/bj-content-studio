<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B&amp;J Speak-Along Camera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
/* One screen: front-camera preview fills it; the line sits at the TOP, right under the lens; controls at the bottom. */
:root{--bg:#07172F;--panel:rgba(13,44,92,.86);--ink:#F4F8FB;--dim:#B9C8D8;--green:#62AA94;--gold:#E6AD3C;--rec:#E5484D;
  --f-script:"Mukta","Nirmala UI","Noto Sans Devanagari",sans-serif;--f-ui:"Poppins","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
video#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--panel),rgba(13,44,92,.72))}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.meta b{color:var(--green);letter-spacing:.08em;text-transform:uppercase}
.meta .sp{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px;color:var(--ink);font-variant-numeric:tabular-nums}
#line{font-family:var(--f-script);font-weight:700;font-size:clamp(26px,7vw,52px);line-height:1.3;margin-top:6px;text-wrap:balance}
#line .w.on{color:var(--gold)} #line .w.done{color:var(--dim)}
#roman{font-size:clamp(13px,3.4vw,19px);color:var(--dim);margin-top:4px}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(45vw,240px);font-weight:700;color:var(--gold);text-shadow:0 4px 30px #000;pointer-events:none}
#recdot{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:45%;background:var(--rec);color:#fff;font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(7,23,47,0),rgba(7,23,47,.92) 30%);display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,label.btn{font:600 15px var(--f-ui);border:0;border-radius:14px;padding:13px 16px;background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#rec{flex:1;background:var(--rec);color:#fff;font-size:17px;min-width:150px}
#rec.busy{background:#7a2a2d}
#status{font-size:13px;color:var(--dim);min-height:1.2em}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);padding:24px;text-align:center}
#start h1{font-size:22px;margin:0;color:var(--green)} #start p{color:var(--dim);max-width:34ch;margin:0;line-height:1.5}
#start button{background:var(--green);color:#06231B;font-size:18px;padding:16px 26px}
input[type=file]{display:none}
.small{font-size:12px;padding:9px 12px}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>

<div class="top">
  <div class="meta"><b>B&amp;J</b><span class="sp" id="packname">Loading…</span><span class="chip" id="pos">–</span></div>
  <div id="line"></div>
  <div id="roman"></div>
</div>
<div id="count" hidden>3</div>
<div id="recdot" hidden>● REC</div>

<div class="bottom">
  <div id="status">Look into the lens. Tap ● Record line.</div>
  <div class="row">
    <button id="prev" aria-label="Previous line">◀</button>
    <button id="rec">● Record line</button>
    <button id="next" aria-label="Next line">▶</button>
  </div>
  <div class="row">
    <button id="hear" class="small">🔊 Listen only</button>
    <label class="btn small" for="files">Load lines from phone</label>
    <input type="file" id="files" accept="audio/*,.txt" multiple>
    <span id="takes" style="font-size:12px;color:var(--dim)"></span>
  </div>
</div>

<div id="start">
  <h1>B&amp;J Speak-Along Camera</h1>
  <p>Front camera + your cloned voice. Each line: 3-2-1, the voice plays, you speak along, the clip saves itself.</p>
  <button id="go">Start camera</button>
  <p style="font-size:13px">Allow camera and microphone when Chrome asks.</p>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let lines=[],i=0,stream=null,rec=null,chunks=[],busy=false,ac=null,takes={},packId='test';
const voice=new Audio(); voice.preload='auto';

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
  const L=lines[i]; if(!L){$('line').textContent='No lines loaded';return}
  $('line').innerHTML=L.text.split(/\s+/).map(w=>`<span class="w">${esc(w)}</span>`).join(' ');
  $('roman').textContent=L.roman||''; $('pos').textContent=`Line ${i+1}/${lines.length}`;
  const t=takes[i]||0; $('takes').textContent=t?`Line ${i+1}: ${t} take${t>1?'s':''} saved`:'';
  voice.src=L.src; voice.load();
}
function beep(f){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.start();o.stop(ac.currentTime+.13)}catch(e){}}
function hl(){const d=voice.duration||1,t=voice.currentTime,ws=[...$('line').querySelectorAll('.w')];
  const L=ws.map(w=>w.textContent.length+1),T=L.reduce((a,b)=>a+b,0);let acc=0;
  ws.forEach((w,k)=>{const a=acc/T*d,b=(acc+L[k])/T*d;acc+=L[k];w.classList.toggle('on',t>=a&&t<b);w.classList.toggle('done',t>=b)});
  if(!voice.paused)requestAnimationFrame(hl)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function countdown(){$('count').hidden=false;for(let k=3;k>0;k--){$('count').textContent=k;beep(880);await sleep(800)}$('count').hidden=true}
async function speak(){voice.currentTime=0;await voice.play();requestAnimationFrame(hl);await new Promise(r=>voice.onended=r)}

function pickType(){for(const t of['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'])
  if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t))return t;return''}
function save(blob,ext){
  takes[i]=(takes[i]||0)+1;
  const name=`BJ_${packId}_L${String(i+1).padStart(2,'0')}_take${takes[i]}.${ext}`;
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  $('status').textContent=`Saved ${name} to Downloads. Do another take, or ▶ next line.`;render();
}
async function recordLine(){
  if(busy||!stream)return; busy=true; $('rec').classList.add('busy'); $('rec').textContent='Recording…';
  const type=pickType(); chunks=[];
  rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:8000000,audioBitsPerSecond:128000}:{});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  rec.start(); $('recdot').hidden=false; $('status').textContent='Get ready…';
  try{await sleep(600);await countdown();$('status').textContent='Speak along now';await speak();await sleep(1200);}
  catch(e){$('status').textContent='The voice could not play. Tap Record again.'}
  rec.stop(); await done; $('recdot').hidden=true;
  const ext=(rec.mimeType||type).includes('mp4')?'mp4':'webm';
  save(new Blob(chunks,{type:rec.mimeType||type||'video/webm'}),ext);
  busy=false;$('rec').classList.remove('busy');$('rec').textContent='● Record line';
}
async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920},frameRate:{ideal:30}},
      // echo cancellation OFF so the clone voice is also captured: it lets Claude line the clip up exactly
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    $('cam').srcObject=stream; $('start').hidden=true;
    try{await navigator.wakeLock?.request('screen')}catch(e){}
    const s=stream.getVideoTracks()[0].getSettings(); $('status').textContent=`Camera ${s.width}×${s.height}. Look into the lens. Tap ● Record line.`;
  }catch(e){$('start').querySelector('p').textContent='Camera or microphone was blocked. In Chrome tap the lock icon next to the address, allow Camera and Microphone, then reload.'}
}
$('go').onclick=startCam;
$('rec').onclick=recordLine;
$('hear').onclick=async()=>{if(busy)return;busy=true;try{await countdown();await speak()}catch(e){}busy=false};
$('prev').onclick=()=>{if(!busy){i=Math.max(0,i-1);render()}};
$('next').onclick=()=>{if(!busy){i=Math.min(lines.length-1,i+1);render()}};
$('files').onchange=async e=>{
  const fs=[...e.target.files],txt=fs.find(f=>f.name.endsWith('.txt'));
  const au=fs.filter(f=>/^audio|\.(mp3|m4a|wav|ogg)$/i.test(f.type||f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const rows=txt?(await txt.text()).split(/\r?\n/).filter(s=>s.trim()):[];
  lines=au.map((f,k)=>({text:rows[k]||f.name.replace(/\.[^.]+$/,''),src:URL.createObjectURL(f)}));
  packId='phone';i=0;$('packname').textContent=`From this phone · ${lines.length} lines`;render();
};
packId=(new URLSearchParams(location.search).get('pack')||'test').replace(/[^\w-]/g,'');
fetch(`packs/${packId}/lines.json`).then(r=>r.json()).then(p=>{
  lines=p.lines.map(l=>({...l,src:`packs/${packId}/${l.src}`}));$('packname').textContent=p.title||packId;render();
}).catch(()=>{$('packname').textContent='Pack not found';});
})();
</script>
</body>
</html>
